model:
  provider: deepseek
  model: deepseek-chat
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com/v1"
  temperature: 0.3
  max_tokens: 2048
  timeout: 15

fallback_models:
  - provider: glm
    model: glm-4-flash
    api_key: "${GLM_API_KEY}"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    temperature: 0.3
    max_tokens: 2048
    timeout: 15

embedding:
  provider: deepseek
  api_key: "${DEEPSEEK_API_KEY}"
  base_url: "https://api.deepseek.com/v1"
  model: text-embedding-3-small
  dimensions: 1024

redis:
  url: "redis://localhost:6379/0"

circuit_breaker:
  failure_threshold: 5
  failure_rate_threshold: 0.5
  recovery_timeout: 30
  min_requests: 10

retry:
  max_retries: 3
  base_delay: 1.0
  max_delay: 30.0

server:
  host: "0.0.0.0"
  port: 8000
